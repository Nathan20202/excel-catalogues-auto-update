name: Surveiller Google Cloud Digital Leader

on:
  schedule:
    - cron: "35 5 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gcdl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler le guide, l’examen et les sources officielles
        run: python scripts/refresh_catalogues.py --catalog gcdl
      - name: Valider
        run: python scripts/validate.py
      - name: Enregistrer les changements
        run: |
          git config user.name "excel-catalogues-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Surveiller Google Cloud Digital Leader"
          git push

