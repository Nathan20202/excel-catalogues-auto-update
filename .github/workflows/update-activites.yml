name: Actualiser le guide des activités

on:
  schedule:
    - cron: "45 4 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler les sources officielles des activités
        run: python scripts/refresh_catalogues.py --catalog activities
      - name: Valider
        run: python scripts/validate.py
      - name: Enregistrer les changements
        run: |
          git config user.name "excel-catalogues-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Actualiser le guide des activités"
          git push
