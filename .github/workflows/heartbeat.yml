name: Maintenir les automatisations actives

on:
  schedule:
    - cron: "5 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/heartbeat.py
      - run: python scripts/validate.py
      - name: Enregistrer le signal mensuel
        run: |
          git config user.name "excel-catalogues-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat.json
          git diff --cached --quiet || git commit -m "Maintenir les actualisations actives"
          git push

