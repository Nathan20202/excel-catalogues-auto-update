name: Actualiser les sites Pokémon

on:
  schedule:
    - cron: "35 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pokemon
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler les boutiques et les preuves de français
        run: python scripts/refresh_catalogues.py --catalog pokemon
      - name: Valider
        run: python scripts/validate.py
      - name: Enregistrer les changements
        run: |
          git config user.name "excel-catalogues-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Actualiser les sites Pokémon"
          git push

