name: Actualiser les marques de vêtements

on:
  schedule:
    - cron: "15 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fashion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôler un lot tournant de marques et sources
        run: python scripts/refresh_catalogues.py --catalog fashion
      - name: Valider
        run: python scripts/validate.py
      - name: Enregistrer les changements
        run: |
          git config user.name "excel-catalogues-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Actualiser les marques de vêtements"
          git push

